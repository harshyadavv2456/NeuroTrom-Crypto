[project]
name = "neurotrom-crypto"
version = "0.1.0"
requires-python = ">=3.12"
description = "NeuroTrom Crypto — independent local crypto intelligence and quantitative research system"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[dependencies]
fastapi = ">=0.143.0"
lightgbm = ">=4.7.0"
logzero = ">=1.7.0"
numpy = ">=2.5.4"
pandas = ">=3.0.6"
pyarrow = ">=26.0.0"
requests = ">=2.34.2"
scikit-learn = ">=1.9.1"
scipy = ">=1.18.1"
tabulate = ">=0.10.0"
uvicorn = {extras = ["standard"], version = ">=0.54.0"}
websockets = ">=13.0"
duckdb = ">=1.0.0"
python-dateutil = ">=2.9.0"
pytz = ">=2024.1"
aiofiles = ">=24.0.0"
tenacity = ">=9.0.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
neurotrom-crypto = "neurotrom_crypto.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
